<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-label="Mapa de empatia de Ana, 28 anos"><rect width="1280" height="880" fill="#ffffff"/>
<text x="54" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#142C42">Mapa de empatia · Ana, 28 anos</text>
<text x="54" y="105" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#566879">Persona primária · rotina corrida | Rotina de cozinhar sem robô</text>
<path d="M54 140H1226 M640 140V730 M54 336H1226 M54 532H1226 M54 730H1226" stroke="#C6D4DF" stroke-width="2"/>
<text x="54" y="180" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Pensa e sente</text>
<text x="54" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Quer conciliar a refeição com seus horários.</text>
<text x="54" y="262" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Fica insegura quando perde uma etapa.</text>
<text x="666" y="180" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Vê</text>
<text x="666" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Ingredientes, louça e pouco espaço livre.</text>
<text x="666" y="262" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Receita no celular e pessoas circulando.</text>
<text x="54" y="376" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Ouve</text>
<text x="54" y="422" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Exaustor, água e temporizadores.</text>
<text x="54" y="458" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Conversas que disputam sua atenção.</text>
<text x="666" y="376" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Fala e faz</text>
<text x="666" y="422" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Separa itens e relê a receita.</text>
<text x="666" y="458" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Alterna tarefas: “Qual é o próximo passo?”</text>
<text x="54" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Dores</text>
<text x="54" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Tempo curto e interrupções.</text>
<text x="54" y="654" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Sequência confusa; receio de errar.</text>
<text x="666" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Ganhos desejados</text>
<text x="666" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Menos esforço para acompanhar o preparo.</text>
<text x="666" y="654" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Perceber quando precisa agir.</text>
<text x="54" y="782" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142C42">Contexto anterior ao ChefBot · Necessidades que orientam a proposta</text>
<text x="54" y="842" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566879">ChefBot · IHR / FEI · Conteúdo hipotético do grupo · Referências: Gray (2017); NN/g (2026)</text>
</svg>