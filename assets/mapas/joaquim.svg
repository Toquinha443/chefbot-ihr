<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 880" role="img" aria-label="Mapa de empatia de Joaquim, 52 anos"><rect width="1280" height="880" fill="#ffffff"/>
<text x="54" y="65" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#142C42">Mapa de empatia · Joaquim, 52 anos</text>
<text x="54" y="105" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#566879">Persona secundária · ajuda ocasional | Rotina de cozinhar sem robô</text>
<path d="M54 140H1226 M640 140V730 M54 336H1226 M54 532H1226 M54 730H1226" stroke="#C6D4DF" stroke-width="2"/>
<text x="54" y="180" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Pensa e sente</text>
<text x="54" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Valoriza seu próprio modo de cozinhar.</text>
<text x="54" y="262" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Quer entender mudanças no preparo.</text>
<text x="666" y="180" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Vê</text>
<text x="666" y="226" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Utensílios familiares e ingredientes.</text>
<text x="666" y="262" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Outra pessoa usando a mesma bancada.</text>
<text x="54" y="376" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Ouve</text>
<text x="54" y="422" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Pedidos de ajuda e preferências da família.</text>
<text x="54" y="458" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Sons de panelas e equipamentos.</text>
<text x="666" y="376" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Fala e faz</text>
<text x="666" y="422" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Confere itens e observa a consistência.</text>
<text x="666" y="458" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Pergunta: “Por que esta etapa vem agora?”</text>
<text x="54" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Dores</text>
<text x="54" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Perder acesso à bancada.</text>
<text x="54" y="654" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Não saber quando intervir.</text>
<text x="666" y="572" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#246594">Ganhos desejados</text>
<text x="666" y="618" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Ajudar sem atrapalhar.</text>
<text x="666" y="654" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#243546">Preservar hábitos e entender o resultado.</text>
<text x="54" y="782" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#142C42">Contexto anterior ao ChefBot · Necessidades que orientam a proposta</text>
<text x="54" y="842" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#566879">ChefBot · IHR / FEI · Conteúdo hipotético do grupo · Referências: Gray (2017); NN/g (2026)</text>
</svg>